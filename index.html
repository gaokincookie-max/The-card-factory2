<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Factory Card Game – 工場基盤</title><link rel="stylesheet" href="./src/style.css"></head><body><header><div><strong>FACTORY CARD GAME</strong><small>v0.3 / Phase 1 工場基盤プロトタイプ</small></div><div class="stats"><span id="money"></span><span id="time"></span></div></header><main><section class="main"><div class="toolbar"><label>施設<select id="kind"></select></label><button id="rotate">回転 R</button><button id="cancel">選択解除 Esc</button><button id="remove">撤去モード</button><button id="belts">ベルト敷設</button><button id="inspect">在庫・レシピ確認</button><button id="pauseInfo">操作方法</button></div><div class="hint" id="hint"></div><div class="board-scroll"><div id="board" aria-label="工場グリッド"></div></div></section><aside><h2>選択中</h2><div id="details">施設を選んで配置してください。</div><h2>試験用ステータス</h2><p>資源ゾーンは4つ。各ゾーンに2×2の採集施設を重ねて配置できます。</p><p>今回の段階では採集・搬送・加工炉と組立加工機のレシピを試せます。カード製造、倉庫、手札、戦闘、CPUは次段階です。</p><div id="log" aria-live="polite"></div></aside></main><script type="module" src="./src/app.js"></script></body></html>
