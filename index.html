<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Factory Card Game — Industrial</title><link rel="stylesheet" href="./src/style.css?v=4.7.30"><link rel="stylesheet" href="./src/menu.css?v=4.7.30"></head><body><div id="gameViewport"><div id="mainMenu" class="main-menu" role="region" aria-label="メインメニュー"></div>
<header class="topbar"><div class="brand"><span class="brand-mark">▥</span><div><strong>FACTORY <em>CARD GAME</em></strong><small>INDUSTRIAL COMMAND / LOGISTICS ALPHA</small></div></div><div class="battle-hud" aria-label="戦況ミニマップ"><div class="core-mini"><small>自軍HP</small><b id="allyHpMini">10000</b><div class="hp"><i id="allyHpBar"></i></div></div><div class="army-mini" id="allyMini" aria-label="自軍配置"></div><span class="versus">VS</span><div class="army-mini" id="enemyMini" aria-label="敵軍配置"></div><div class="core-mini enemy"><small>敵HP</small><b id="enemyHpMini">10000</b><div class="hp"><i id="enemyHpBar"></i></div></div></div><div class="right-head"><button type="button" class="battle-button" id="openMenuButton">⌂ メニュー</button><div class="currency"><span>BUILD MATERIALS</span><strong id="money">100</strong></div><button id="battleButton" class="battle-button" type="button">⚔ 戦闘画面</button></div></header>
<div class="status-row"><span class="live">● INDUSTRIAL GRID / ONLINE</span><span id="time">経過 0秒</span><span>ZONE 4 / AUTO PRODUCTION</span><span class="phase-label">PHASE 3.5 · 共通カードUI</span></div>
<main class="workarea"><section class="factory-panel"><div class="board-head"><div><h1>工業画面 <span>INDUSTRIAL GRID</span></h1><p>採集 → 加工 → カード製造 → 倉庫 → 中央出荷。見ていない画面も進行し続けます。</p></div><div class="board-tools"><button id="pauseInfo" type="button">? 操作</button></div></div><div class="board-scroll"><div id="board" aria-label="工場グリッド"></div></div><div class="board-foot"><div class="hint" id="hint" aria-live="polite"></div><div class="legend"><span>◆ 資源ゾーン</span><span>▣ 施設</span><span>● 搬送中</span></div></div></section>
</main>
<section class="battle-preview combat-view" id="battlePreview" hidden></section>
<div class="build-dock" id="dock"><div class="dock-upper"><button id="dockToggle" type="button" aria-label="建築メニューを閉じる">⌄ メニューをしまう</button><strong>▦ BUILD MENU</strong><div class="tabs"><button class="tab active" data-category="gather" type="button">採集</button><button class="tab" data-category="process" type="button">加工</button><button class="tab" data-category="factory" type="button">カード製造</button><button class="tab" data-category="storage" type="button">保管</button><button class="tab" data-category="boost" type="button">強化</button></div><button id="belts" class="dock-belt" type="button">↳ ベルト敷設</button></div><div class="building-cards" id="buildingCards"></div></div>
<div id="floatingActions" class="floating-actions" hidden></div>
<div id="uiOverlay" class="ui-overlay" hidden><section class="ui-modal" id="modalPanel" role="dialog" aria-modal="true" aria-label="施設詳細"></section></div>
<div id="cardDetailOverlay" class="card-detail-overlay" hidden><section id="cardDetailPanel" class="card-detail-panel" role="dialog" aria-modal="true" aria-label="カード詳細"></section></div>
<select id="kind" hidden></select></div><script type="module" src="./src/app.js?v=4.7.30"></script></body></html>
